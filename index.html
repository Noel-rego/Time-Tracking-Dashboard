<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time tracking dashboard</title>
</head>
<body>
    <header></header>
    <main>
        <div>
            <div class="left-side">
                <div class="profile">
                    <img/>
                    <p class="name-for">Report for</p>
                    <h1 class="name">Jeremy Robson</h1>
                </div>
                <div class="choices">
                    <div class="Daily">daily</div>
                    <div class="Weekly">weekly</div>
                    <div class="Monthly">monthly</div>
                </div>
            </div>
            <div class="right-side">
                <div class="workbox">
                    <img src="" alt="">
                    <div class="description">
                        <div class="work">Work</div>
                        <div>...</div>
                    </div>
                    <div class="hours">32hrs</div>
                    <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="hrs">36hrs</p>
                    </div>
                </div>
                <div class="play">
                    <img src="" alt="">
                    <div class="description">
                        <div class="work">Play</div>
                        <div>...</div>
                    </div>
                    <div class="hours">10hrs</div>
                    <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="hrs">8hrs</p>
                    </div>
                </div>
                <div class="study">
                    <img src="" alt="">
                    <div class="description">
                        <div class="work">Study</div>
                        <div>...</div>
                    </div>
                    <div class="hours"42hrs</div>
                    <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="hrs">7hrs</p>
                    </div>
                </div>
                <div class="excersise">
                    <img src="" alt="">
                    <div class="description">
                        <div class="work">Excersise</div>
                        <div>...</div>
                    </div>
                    <div class="hours">4hrs</div>
                    <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="hrs">5hrs</p>
                    </div>
                </div>
                <div class="social">
                    <img src="" alt="">
                    <div class="description">
                        <div class="work">Social</div>
                        <div>...</div>
                    </div>
                    <div class="hours">5hrs</div>
                    <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="hrs">10hrs</p>
                    </div>
                </div>
                <div class="selfcare">
                    <img src="" alt="">
                    <div class="description">
                        <div class="work">Self care</div>
                        <div>...</div>
                    </div>
                    <div class="hours">2hrs</div>
                    <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="hrs">2hrs</p>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <footer></footer>
    
</body>
</html>
