<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time tracking dashboard</title>
    <link rel="stylesheet" href="style.css"></link>
</head>
<body>
    <header></header>
    <main>
        <div class="maindiv">
            <div class="left-side">
                <div class="profile">
                    <img class="profilepic" src="image-jeremy.png" alt="personsprofile">
                    <p class="name-for">Report for</p>
                    <h1 class="name">Jeremy Robson</h1>
                </div>
                    <div class="Daily">daily</div>
                    <div class="Weekly">weekly</div>
                    <div class="Monthly">monthly</div>
            </div>
            
            <div class="right-side">
                <div class="box" id="workbox">
                    <img class="print" src="icon-work.svg" alt="workicon">
                    <div class="info">
                     <div class="description">
                        <div class="work">Work</div>
                        <img class="dots" src="icon-ellipsis.svg" alt="dots">
                     </div>
                     <h1 class="hours" id="workhrs">32hrs</h1>
                     <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="lastworkhrs">36hrs</p>
                     </div>
                    </div>
                </div>
                <div class="box" id="playbox">
                    <img class="print" src="icon-play.svg" alt="playicon">
                    <div class="info">
                     <div class="description">
                        <div class="play">Play</div>
                        <img class="dots" src="icon-ellipsis.svg" alt="dots">
                     </div>
                     <h1 class="hours" id="playhrs">10hrs</h1>
                     <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="lastplayhrs">8hrs</p>
                     </div>
                    </div>
                </div>
                <div class="box" id="studybox">
                    <img class="print" src="icon-study.svg" alt="studyicon">
                    <div class="info">
                     <div class="description">
                        <div class="Study">Study</div>
                        <img class="dots" src="icon-ellipsis.svg" alt="dots">
                     </div>
                     <h1 class="hours" id="studyhrs">42hrs</h1>
                     <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="laststudyhrs">7hrs</p>
                     </div>
                    </div>
                </div>
                <div class="box" id="excersisebox">
                    <img class="print" src="icon-exercise.svg" alt="exerciseicon">
                    <div class="info">
                     <div class="description">
                        <div class="work">Excersise</div>
                        <img class="dots" id="excdot" src="icon-ellipsis.svg" alt="dots">
                     </div>
                     <h1 class="hours"id="excerhrs">4hrs</h1>
                     <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="lastexcerhrs">5hrs</p>
                     </div>
                    </div>
                </div>
                <div class="box" id="socialbox">
                    <img class="print" src="icon-social.svg" alt="socialicon">
                    <div class="info">
                     <div class="description">
                        <div class="work">Social</div>
                        <img class="dots" src="icon-ellipsis.svg" alt="dots">
                     </div>
                     <h1 class="hours" id="socialhrs">5hrs</h1>
                     <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="lastsocialhrs">10hrs</p>
                     </div>
                    </div>
                </div>
                <div class="box" id="selfcarebox">
                        <img class="print" src="icon-self-care.svg" alt="selfcareicon">
                    <div class="info">
                     <div class="description">
                        <div class="work">Self-care</div>
                        <img class="dots" id="selfdot" src="icon-ellipsis.svg" alt="dots">
                     </div>
                     <h1 class="hours" id="socialhrs">2hrs</h1>
                     <div class="last-week">
                        <p class="week">Last Week - </p>
                        <p class="hrs" id="lastsocialhrs">2hrs</p>
                     </div>
                 </div>
                </div>

            </div> 
        </div>
    </main>
    <footer></footer>
    <script src="first.js"></script>
    
</body>
</html>
